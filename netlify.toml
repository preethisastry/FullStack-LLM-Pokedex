# Netlify configuration for PK's Pokédex

[build]
  # Vanilla HTML/CSS/JS project served from root
  publish = "."

# Cache control for optimal performance
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
